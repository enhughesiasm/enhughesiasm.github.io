name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Astro checks
            command: npm run check
          - name: Unit tests
            command: npm test
          - name: ESLint
            command: npm run lint
          - name: Prettier
            command: npm run format:check
          - name: Production build
            command: npm run build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: ${{ matrix.command }}
